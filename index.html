<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Maths Bac - Automatismes QCM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .app {
      width: 90%;
      max-width: 650px;
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .question {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .options button {
      width: 100%;
      margin: 6px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #334155;
      color: white;
      font-size: 15px;
    }

    .options button:hover {
      background: #475569;
    }

    .btn-next {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #22c55e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .score {
      text-align: center;
      font-size: 22px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="app">
  <h1>🧮 Automatismes Bac Maths</h1>

  <div id="quiz">
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <button class="btn-next" onclick="nextQuestion()">Question suivante</button>
  </div>

  <div id="result" style="display:none;">
    <div class="score" id="score"></div>
  </div>
</div>

<script>

const questions = [
  {
    q: "Simplifier : 3x + 2x",
    options: ["5x", "6x", "3x²", "x"],
    answer: 0
  },
  {
    q: "Résoudre : 5x = 20",
    options: ["x = 2", "x = 4", "x = 5", "x = 10"],
    answer: 1
  },
  {
    q: "Dérivée de x²",
    options: ["x", "2x", "x²", "2"],
    answer: 1
  },
  {
    q: "10% de 50 = ?",
    options: ["2", "5", "10", "15"],
    answer: 1
  },
  {
    q: "Si f(x)=2x, alors f(3)= ?",
    options: ["5", "6", "8", "9"],
    answer: 1
  },
  {
    q: "√49 = ?",
    options: ["6", "7", "8", "9"],
    answer: 1
  }
];

let current = 0;
let score = 0;
let locked = false;

function showQuestion() {
  locked = false;

  const q = questions[current];
  document.getElementById("question").innerText = q.q;

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  q.options.forEach((opt, index) => {
    const btn = document.createElement("button");
    btn.innerText = opt;

    btn.onclick = () => selectAnswer(btn, index);

    optionsDiv.appendChild(btn);
  });
}

function selectAnswer(button, index) {
  if (locked) return;
  locked = true;

  const correct = questions[current].answer;
  const buttons = document.querySelectorAll(".options button");

  buttons.forEach((b, i) => {
    if (i === correct) {
      b.style.background = "#16a34a"; // vert
    }
  });

  if (index === correct) {
    button.style.background = "#16a34a";
    score++;
  } else {
    button.style.background = "#dc2626"; // rouge
  }
}

function nextQuestion() {
  current++;

  if (current < questions.length) {
    showQuestion();
  } else {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("score").innerText =
      "Score final : " + score + " / " + questions.length;
  }
}

showQuestion();

</script>

</body>
</html>
